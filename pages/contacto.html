        <!-- Ruta a Media Queris -->

        <link rel="stylesheet" href="../assets/css/estilos.css" />

        <!-- Enlaces a Google Fonts -->

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Título de la pestaña del navegador -->
        <title>Plantillas y formularios | Contacto</title>
    </head>

    <body>
        <header>
            <a href="../index.html" class="no-border" title="Página principal">
                <figure class="logo"></figure>
                <h1 class="pechado">Elaboración de plantillas y formularios (UF1304)</h1>
            </a>
            <!-- Slogan -->
            <p class="pechado">Curso de Confección Publicación de Páginas Web (IFCD0110)</p>
        </header>

        <nav class="principal" aria-label="Navegación principal">
            <h2 class="pechado">Menú Principal</h2>
            <input id="icon-menu" name="icon-menu" type="checkbox" />
            <label for="icon-menu" class="icon-menu" aria-label="Abrir/Cerrar menú">Menú</label>
            <ul>
                <li>
                    <a href="../index.html">Inicio</a>
                </li>
                <li>
                    <a href="#">Temas</a>
                    <ul>
                        <li>
                            <a href="#">Textos</a>
                        </li>

                        <li>
                            <a href="#">Imágenes</a>
                        </li>
                        <li>
                            <a href="../temas/formularios.html">Formularios</a>
                        </li>
                    </ul>
                </li>
                <li>
                    <a href="../legal/lopd.html">Nosotros</a>
                </li>
                <li>
                    <a href="../pages/contacto.html">Contacto</a>
                </li>
            </ul>
        </nav>

        <main class="agua">
            <section>
                <header class="img-before portada">
                    <h2>Contacta con nosotros</h2>
                </header>
                <article>
                    <h3>Formulario de contacto</h3>
                    <form action="enviado.html" method="get" enctype="multipart/form-data" class="form" id="form">
                        <fieldset>
                            <legend>Datos Personales</legend>
                            <ul>
                                <li>
                                    <label for="name">Nombre</label>
                                    <input type="text" name="name" id="name" placeholder="Tu nombre" required />
                                </li>
                                <li>
                                    <label for="email">E-mail</label>
                                    <input type="email" name="email" id="email" placeholder="Correo electrónico" required />
                                </li>
                                <li>
                                    <label for="tfno">Teléfono</label>
                                    <input type="tel" name="tfno" id="tfno" placeholder="Teléfono" />
                                </li>
                                <li>
                                    <label for="edad">Edad</label>
                                    <input type="number" name="edad" id="edad" placeholder="Tu edad" />
                                </li>
                                <li>
                                    <input type="radio" name="coche" id="coche-si" value="Si" />
                                    <label for="coche-si">Coche propio Si</label>
                                </li>
                                <li>
                                    <input type="radio" name="coche" id="coche-no" value="No" />
                                    <label for="coche-no">Coche propio No</label>
                                </li>
                                <li>
                                    <input type="checkbox" name="acepto" id="acepto" required />
                                    <label for="acepto">Acepto el tratamiento de mis datos personales</label>
                                </li>
                                <li>
                                    <label for="mensaje">Tu mensaje</label>
                                    <textarea name="menaje" id="mensaje" cols="30" rows="5" placeholder="Escribe tu mensaje aquí" required></textarea>
                                </li>
                            </ul>
                        </fieldset>
                        <p id="errores"></p>
                        <ul class="enviar">
                            <li>
                                <input type="submit" value="Enviar" id="enviar" />
                                <!-- <button type="submit">Enviar</button> -->
                            </li>
                            <li>
                                <input type="reset" value="Borrar" />
                                <!-- <button type="reset">Borrar</button> -->
                            </li>
                        </ul>
                    </form>
                </article>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
