<!doctype html>
<html lang="es">
    <head>
        <!-- Juego de caracteres de casi todos los idiomas humanos (incluidos ñ, tildes ...) -->
        <meta charset="utf-8" />
        <!-- Escala inicial y renderizado _responsive_ por el ancho del dispositivo -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Compatibilidad con Microsoft Explorer -->
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <!-- Indéxame NO y sígueme NO -->
        <meta name="robots" content="noIndex, noFollow" />
        <!-- Breve descripción del sitio que se verá en los resultados de búsqueda -->
        <meta name="description" content="Sitio web de prueba elaborado en el curso de Confección y Publicación de Páginas Web (IFCD0110). Unidad Formativa UF1303, Elaboración de hojas de estilos" />

        <!-- Utilícese una hoja de estilos Normalize -->
        <link rel="stylesheet" href="https://necolas.github.io/normalize.css/latest/normalize.css" />
        <!-- Ruta a las hojas de visibilidad -->
        <link rel="stylesheet" href="../assets/css/visibilidad.css" />
        <!-- Ruta a las variables -->
        <link rel="stylesheet" href="../assets/css/variables.css" />
        <!-- Ruta a Hover.css -->
        <link rel="stylesheet" href="../assets/css/hover.css" />
        <!-- Ruta a la galería y al carrousel -->
        <link rel="stylesheet" href="../assets/css/imagenes.css" />
        <link rel="stylesheet" href="../assets/css/carrousel.css" />
        <!-- Ruta a Media Queris -->
        <link rel="stylesheet" href="../assets/css/mediaqueris.css" />
        <!-- Ruta a Logo web-->
        <link rel="stylesheet" href="../assets/css/logo.css" />
        <!-- Ruta a transformers -->
        <link rel="stylesheet" href="../assets/css/transformers.css" />
        <!-- Ruta a edición menú principal -->
        <link rel="stylesheet" href="../assets/css/menu.css" />
        <link rel="stylesheet" href="../assets/css/footer.css" />

        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
        <!-- Ruta a las tipografías -->
        <link rel="stylesheet" href="../assets/css/tipografia.css" />
        <!-- Ruta a las hojas de estilos -->
        <link rel="stylesheet" href="../assets/css/estilos.css" />

        <!-- Enlaces a Google Fonts -->

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tourney:ital,wdth,wght@0,75..125,100..900;1,75..125,100..900&display=swap" rel="stylesheet" />

        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

        <!-- Título de la pestaña del navegador -->
        <title>UF1303 | Elaboración de hojas de estilos</title>
    </head>
    <body>
        <header id="header">
            <a href="#" class="no-border" title="Mi página FlexBox">
                <figure class="logo"></figure>
                <h1 class="pechado">Página FlexBox Cristi Álvarez</h1></a
            >
        </header>

        <nav id="menu" class="principal" aria-label="Navegación principal"></nav>

        <main class="agua">
            <section>
                <header class="portada img-before">
                    <h2 class="hvr-wobble-to-bottom-right">Imágenes en CSS</h2>
                </header>
                <article class="galeria-flex">
                    <h3>Galería de imágenes</h3>
                    <p>Parrilla de imágenes con Flexbox</p>

                    <ul class="galeria">
                        <li>
                            <figure class="img-before diapositiva-1 hvr-grow-rotate">
                                <figcaption>Foto 1</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="img-before diapositiva-2 hvr-grow-rotate">
                                <figcaption>Foto 2</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="img-before diapositiva-3 hvr-grow-rotate">
                                <figcaption>Foto 3</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="img-before diapositiva-4 hvr-grow-rotate">
                                <figcaption>Foto 4</figcaption>
                            </figure>
                        </li>

                        <li>
                            <figure class="img-before diapositiva-5 hvr-grow-rotate">
                                <figcaption>Foto 5</figcaption>
                            </figure>
                        </li>
                    </ul>
                </article>
            </section>
        </main>
        <footer id="footer"></footer>
    </body>
    <script>
        $(function () {
            $("#header").load("../layouts/header.html");
            $("#menu").load("../layouts/nav.html");
            $("#footer").load("../layouts/footer.html");
        });
    </script>
</html>
